org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true

# ── Release knobs (docs/TV.md "Release build (Google Play)") ─────────────────────────────────────────────────────────
# Server URL -> BuildConfig.SERVER_URL (docs/TV.md "Production server URL"). Origins only: https, no path, no trailing
# slash. -PserverUrl=… (or env ORG_GRADLE_PROJECT_serverUrl) overrides both for one build.
#  - jamaa.prodServerUrl: RELEASE builds = the production Worker "jamaa" (`pnpm run deploy`). Until a custom domain
#    exists it is the Worker's workers.dev origin; the account's workers.dev subdomain is still the pre-rename one
#    (README owner step O1). With a domain, change this one line (and JOIN_BASE_URL in server/wrangler.jsonc).
#  - jamaa.previewServerUrl: DEBUG builds without -PserverUrl = the preview Worker "play" (`pnpm run deploy:preview`).
#    A release build refuses it.
jamaa.prodServerUrl=https://jamaa.mishana.workers.dev
jamaa.previewServerUrl=https://play.mishana.workers.dev
# Play version (docs/TV.md "Versions"): versionCode +1 for EVERY upload to any Play track (Play refuses a reused or
# lower code); versionName = MAJOR.MINOR.PATCH shown to users. Bump both in the release commit.
jamaa.versionCode=3
jamaa.versionName=1.0.0
