org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Production server URL -> BuildConfig.SERVER_URL (docs/TV.md "Production server URL").
# PLACEHOLDER: replace with your deployed Worker origin before a release build, e.g. the URL `pnpm deploy`
# prints (https://mish-ana.<your-subdomain>.workers.dev) or your custom domain. https only, no trailing path.
# assembleRelease/bundleRelease fail while this is still the example.workers.dev placeholder.
# Dev builds override it per build: -PserverUrl=http://<mac-ip>:8787
mishana.prodServerUrl=https://mish-ana.example.workers.dev
