org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Production server URL -> BuildConfig.SERVER_URL (docs/TV.md "Production server URL").
# The deployed Worker origin: the URL `pnpm run deploy` prints (https://play.<your-subdomain>.workers.dev) or
# your custom domain. https only, no trailing path. assembleRelease/bundleRelease fail if this is the
# https://play.example.workers.dev placeholder.
# Dev builds override it per build: -PserverUrl=http://<mac-ip>:8787
jamaa.prodServerUrl=https://play.jamaa.workers.dev
