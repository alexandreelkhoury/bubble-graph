<!doctype html>
<html><head><meta charset="utf-8"><title>Mish Ana palette mock-ups</title>
<style>
@font-face{font-family:Cairo;src:url(file:///home/alex/bubble-graph/growth/video/public/fonts/cairo_black.ttf);font-weight:900}
@font-face{font-family:Cairo;src:url(file:///home/alex/bubble-graph/growth/video/public/fonts/cairo_bold.ttf);font-weight:700 800}
@font-face{font-family:Cairo;src:url(file:///home/alex/bubble-graph/growth/video/public/fonts/cairo_semibold.ttf);font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:Cairo;padding:20px;display:flex;flex-wrap:wrap;gap:20px}

/* ---------- token sets ---------- */
.cur{--bg:#120A1F;--bgDeep:#0B0614;--glow:#22103A;--surface:#1E1430;--elev:#2A1D42;--outline:#4A3A66;--text:#FFF7EC;--text2:#CFC3E0;--muted:#9A8CB3;--primary:#FF3D8B;--accent:#FFC23D;--ink:#120A1F;
  --coral:#F0183A;--azure:#478CFF;--lemon:#FFF04D;--jade:#1FA88A;--grape:#7A43FF;--tang:#FF7A1F;--grapeInk:#FFF7EC;
  --bgimg:radial-gradient(120% 70% at 50% 0%, #22103A 0%, #120A1F 55%, #0B0614 100%);--phone:#05030A;--screen:#120A1F;--tileRing:none;--tileShadow:none;--grain:0}
.b{--bg:#2B1650;--bgDeep:#1D1036;--glow:#6A2E9E;--surface:#3A2266;--elev:#4A2E7E;--outline:#6E55A0;--text:#FFF7EC;--text2:#E3D7F5;--muted:#B9A8D6;--primary:#FF4F9A;--accent:#FFC94D;--ink:#1A0B2E;
  --coral:#FF3355;--azure:#5A9BFF;--lemon:#FFF04D;--jade:#2BC49F;--grape:#9A6BFF;--tang:#FF8A33;--grapeInk:#1A0B2E;
  --bgimg:radial-gradient(60% 38% at 8% 100%, rgba(255,138,51,.30) 0%, rgba(255,138,51,0) 100%),radial-gradient(70% 40% at 100% 62%, rgba(255,79,154,.22) 0%, rgba(255,79,154,0) 100%),radial-gradient(110% 60% at 50% 0%, #6A2E9E 0%, #3E1C70 38%, #2B1650 68%, #1D1036 100%);
  --phone:#140A26;--screen:#2B1650;--tileRing:0 0 0 0 transparent;--tileShadow:0 14px 30px rgba(10,4,24,.45);--grain:.10}
.a{--bg:#FFF1E0;--bgDeep:#FFE2C2;--glow:#FFD6E6;--surface:#FFFFFF;--elev:#FFF8F0;--outline:#1A0B2E;--text:#1A0B2E;--text2:#5A4A75;--muted:#6E5F88;--primary:#FF2E7E;--accent:#FFB800;--ink:#1A0B2E;
  --coral:#FF2D4B;--azure:#2F7BFF;--lemon:#FFE01A;--jade:#00B386;--grape:#7B3CFF;--tang:#FF6A00;--grapeInk:#FFFFFF;
  --bgimg:radial-gradient(70% 45% at 100% 0%, #FFC9DF 0%, rgba(255,201,223,0) 100%),radial-gradient(70% 45% at 0% 100%, #FFE08A 0%, rgba(255,224,138,0) 100%),#FFF1E0;
  --phone:#1A0B2E;--screen:#FFFFFF;--tileShadow:6px 6px 0 #1A0B2E;--grain:.06}

/* ---------- 9:16 frame at 0.5 scale (540 x 960 = 1080 x 1920) ---------- */
.frame{position:relative;width:540px;height:960px;overflow:hidden;background:var(--bgimg);color:var(--text)}
.frame::after{content:"";position:absolute;inset:0;opacity:var(--grain);pointer-events:none;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.label{position:absolute;left:10px;bottom:8px;font:700 11px Cairo;color:rgba(255,255,255,.55);z-index:9;background:rgba(0,0,0,.35);padding:1px 8px;border-radius:99px}
.a .label{color:#1A0B2E;background:rgba(255,255,255,.7)}

/* captions */
.cap{position:absolute;left:30px;right:30px;top:110px;text-align:center;font-weight:900;line-height:1.02;letter-spacing:-.01em}
.cur .cap{font-size:39px;-webkit-text-stroke:3px var(--bg);paint-order:stroke fill}
.cur .cap .hot{color:var(--accent)}
.b .cap,.a .cap{font-size:50px}
.plate{display:inline-block;padding:0 .22em .04em;border-radius:.2em;transform:rotate(-2.5deg);margin-left:.08em}
.b .plate{background:var(--accent);color:var(--ink);box-shadow:0 8px 24px rgba(255,201,77,.35)}
.a .plate{background:var(--primary);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.a .cap .w1{color:var(--ink)}

/* phones */
.phone{position:absolute;border-radius:26px;background:var(--phone);padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.a .phone{box-shadow:6px 8px 0 rgba(26,11,46,.9)}
.scr{width:100%;height:100%;border-radius:21px;background:var(--screen);position:relative;overflow:hidden;font-weight:800}
.b .scr{background:linear-gradient(180deg,#341A5E,#2B1650)}
.scr .top{position:absolute;top:14px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;font-size:9px}
.chip{background:var(--surface);color:var(--accent);padding:1px 6px;border-radius:99px;font-weight:900;letter-spacing:.06em}
.a .chip{background:var(--ink);color:var(--accent)}
.scr .yw{position:absolute;top:44px;width:100%;text-align:center;font-size:10px;color:var(--text2)}
.card{position:absolute;left:12%;right:12%;top:66px;bottom:34%;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--ink)}
.a .card{border:2.5px solid var(--ink)}
.mole{outline:4px solid var(--accent);outline-offset:3px}
.b .mole{box-shadow:0 0 0 4px var(--accent),0 0 50px rgba(255,201,77,.55),0 18px 40px rgba(0,0,0,.45);outline:none}
.a .mole{box-shadow:0 0 0 5px var(--primary),8px 10px 0 var(--ink);outline:none}

/* tiles row */
.tiles{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:12px}
.tile{width:92px;height:104px;border-radius:18px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:14px;box-shadow:var(--tileShadow)}
.a .tile{border:2.5px solid var(--ink)}
.av{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;color:var(--ink)}

/* end card */
.wm{font-weight:900;letter-spacing:-.01em;line-height:1;position:relative;display:inline-block}
.bang{display:inline-block;width:.2em;height:.62em;background:var(--primary);border-radius:99px;transform:skewX(-8deg);margin-left:.06em;position:relative;top:-.05em}
.bang::after{content:"";position:absolute;left:.005em;top:.74em;width:.19em;height:.19em;border-radius:99px;background:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:12px;background:#000;color:#fff;border-radius:14px;padding:10px 22px 10px 16px;border:1.5px solid #A6A6A6}
.badge small{display:block;font:700 11px Cairo;letter-spacing:.04em}
.badge b{display:block;font:800 26px Cairo;line-height:1}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{font-weight:800;font-size:15px;padding:5px 14px;border-radius:99px;background:var(--surface);color:var(--text)}
.a .pill{border:2px solid var(--ink)}
.tv{position:absolute;border-radius:16px;background:var(--phone);padding:8px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.a .tv{box-shadow:8px 10px 0 var(--ink)}
.tvs{width:100%;height:100%;border-radius:10px;background:var(--bgimg);position:relative;overflow:hidden}
.b .tvs{background:radial-gradient(100% 80% at 50% 0%, #5A2690 0%, #2B1650 70%)}
.a .tvs{background:#FFF8F0}
</style></head>
<body>
<script>
const V=[['cur','CURRENT'],['b','B · EVOLVED CURRENT (recommended)'],['a','A · BRIGHTER PARTY']];
const P=[['coral','circle','M','Maya','PIZZA'],['azure','square','K','Karim','PIZZA'],['lemon','star','L','Lea','PIZZA'],['jade','triangle','J','Joe','PIZZA'],['tang','hexagon','S','Sami','PASTA']];
const SH={circle:'M50 4a46 46 0 1 1 0 92a46 46 0 1 1 0-92z',square:'M22 6h56a16 16 0 0 1 16 16v56a16 16 0 0 1-16 16H22A16 16 0 0 1 6 78V22A16 16 0 0 1 22 6z',
star:'M50 3l13.6 29.2 32 3.8-23.6 21.8 6.3 31.6L50 73.6 21.7 89.4 28 57.8 4.4 36l32-3.8z',triangle:'M50 6c3 0 5.6 1.6 7 4.2l38 68c2.9 5.3-.9 11.8-7 11.8H12c-6.1 0-9.9-6.5-7-11.8l38-68C44.4 7.6 47 6 50 6z',
diamond:'M44 6.6a8.5 8.5 0 0 1 12 0l37.4 37.4a8.5 8.5 0 0 1 0 12L56 93.4a8.5 8.5 0 0 1-12 0L6.6 56a8.5 8.5 0 0 1 0-12z',hexagon:'M50 4l40 23v46L50 96 10 73V27z'};
const av=(c,s,i,v,size=46)=>`<div class="av" style="position:relative;width:${size}px;height:${size}px"><svg viewBox="0 0 100 100" width="${size}" height="${size}" style="position:absolute;inset:0;overflow:visible"><path d="${SH[s]}" fill="var(--${c})" ${v==='a'?'stroke="#1A0B2E" stroke-width="7" stroke-linejoin="round"':''}/></svg><span style="position:relative;font-size:${size*.4}px;${s==='triangle'?'padding-top:'+size*.18+'px':''}">${i}</span></div>`;
let html='';
// scene 1: hook "Except his."
for(const [v,name] of V){
  const big=v!=='cur';
  const pw=big?150:118, ph=pw*2.05;
  const pos=big?[[95,330,-8],[270,300,0],[445,330,8],[150,610,-5]]:[[120,250,0],[255,240,0],[390,250,0],[185,505,0]];
  let ph5='';
  P.slice(0,4).forEach((p,k)=>{const [x,y,r]=pos[k];ph5+=`<div class="phone" style="left:${x-pw/2}px;top:${y-ph/2+ph/2-60}px;width:${pw}px;height:${ph}px;transform:rotate(${r}deg)"><div class="scr"><div class="top"><span class="chip">JQPU</span><span>${p[3]}</span></div><div class="yw">Your secret word</div><div class="card" style="background:var(--${p[0]});font-size:${pw*.19}px">${p[4]}</div></div></div>`});
  const mx=big?375:320, my=big?640:505, mw=big?pw*1.18:pw, mh=mw*2.05;
  ph5+=`<div class="phone mole" style="left:${mx-mw/2}px;top:${my-mh/2+mh/2-60}px;width:${mw}px;height:${mh}px;transform:rotate(${big?6:0}deg);z-index:3"><div class="scr"><div class="top"><span class="chip">JQPU</span><span>Sami</span></div><div class="yw">Your secret word</div><div class="card" style="background:var(--tang);font-size:${mw*.19}px">PASTA</div></div></div>`;
  const cap = v==='cur'? `Except <span class="hot">his.</span>` : `<span class="w1">Except</span><span class="plate">his.</span>`;
  html+=`<div class="frame ${v}" id="hook-${v}"><div class="cap">${cap}</div>${ph5}<div class="label">${name} · hook frame</div></div>`;
}
// scene 2: vote / OUT frame with tiles
for(const [v,name] of V){
  const big=v!=='cur';
  const sc=big?1.3:1;
  let t1='',t2='';
  P.forEach((p,k)=>{const dim=k<4?(big?'opacity:.55;':'opacity:.4;'):''; const isM=k===4;
    const el=`<div class="tile" style="${dim}width:${92*sc}px;height:${104*sc}px;font-size:${14*sc}px;${isM?'box-shadow:0 0 0 4px var(--accent),var(--tileShadow);':''}">${av(p[0],p[1],p[2],v,46*sc)}<span>${p[3]}</span></div>`;
    if(k<3)t1+=el;else t2+=el;});
  const cap = v==='cur'? `IT WAS <span class="hot">YOU?!</span>` : `<span class="w1">IT WAS</span><span class="plate">YOU?!</span>`;
  const stamp = `<div style="position:absolute;left:${big?300:265}px;top:${big?640:520}px;transform:rotate(-8deg);z-index:5;background:var(--accent);color:var(--ink);font-weight:900;font-size:${big?58:40}px;padding:0 22px;border-radius:12px;${v==='a'?'border:3px solid #1A0B2E;box-shadow:6px 6px 0 #1A0B2E':'box-shadow:0 12px 30px rgba(0,0,0,.4)'}">OUT</div>`;
  html+=`<div class="frame ${v}" id="vote-${v}"><div class="cap">${cap}</div><div class="tiles" style="top:${big?300:250}px;gap:${12*sc}px">${t1}</div><div class="tiles" style="top:${big?470:380}px;gap:${12*sc}px">${t2}</div>${stamp}
  <div style="position:absolute;left:0;right:0;top:${big?790:620}px;text-align:center;font-weight:900;font-size:${big?30:20}px;color:var(--accent)">${v==='a'?'<span style="background:var(--ink);padding:2px 14px;border-radius:10px">Sami was the Mole</span>':'Sami was the Mole'}</div><div class="label">${name} · reveal frame</div></div>`;
}
// scene 3: end card
for(const [v,name] of V){
  if(v==='cur'){html+=`<div class="frame cur" id="end-cur" style="background:#0B0614"><img src="../f-endcard.png" style="width:540px;height:960px"><div class="label">CURRENT · end card (rendered frame)</div></div>`;continue;}
  let tiles='';P.forEach(p=>tiles+=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800">${av(p[0],p[1],p[2],v,56)}<span>${p[3]}</span></div>`);
  html+=`<div class="frame ${v}" id="end-${v}">
   <div class="tv" style="left:50px;top:120px;width:440px;height:262px;transform:rotate(-2deg)"><div class="tvs">
     <div style="position:absolute;top:22px;width:100%;text-align:center;font-weight:900;font-size:22px;color:var(--text)">Who's not one of us?</div>
     <div style="position:absolute;top:72px;width:100%;display:flex;justify-content:center;gap:16px;color:var(--text)">${tiles}</div>
     <div style="position:absolute;left:300px;top:170px;transform:rotate(-8deg);background:var(--accent);color:var(--ink);font-weight:900;font-size:30px;padding:0 14px;border-radius:8px;${v==='a'?'border:2.5px solid #1A0B2E':''}">OUT</div>
   </div></div>
   <div class="phone" style="left:420px;top:250px;width:96px;height:196px;transform:rotate(9deg);z-index:4"><div class="scr"><div class="yw" style="top:30px">Your secret word</div><div class="card" style="top:52px;bottom:30%;background:var(--coral);font-size:20px">PIZZA</div></div></div>
   <div style="position:absolute;top:490px;width:100%;text-align:center"><span class="wm" style="font-size:82px">MISH ANA<span class="bang"></span></span></div>
   <div style="position:absolute;top:610px;width:100%;text-align:center;font-weight:800;font-size:25px;color:var(--text2)">The secret-word party game for your TV</div>
   <div style="position:absolute;top:670px;width:100%;display:flex;justify-content:center"><div class="badge" style="transform:scale(1.15)"><svg width="34" height="38" viewBox="0 0 34 38"><path d="M2 2l18 17L2 36z" fill="#00D7FE"/><path d="M2 2l24 13-6 4z" fill="#00F076"/><path d="M2 36l18-17 6 4z" fill="#FF3A44"/><path d="M26 15l6 4-6 4-6-4z" fill="#FFD400"/></svg><span><small>GET IT ON</small><b>Google Play</b></span></div></div>
   <div style="position:absolute;top:770px;left:0;right:0" class="pills"><span class="pill">Free</span><span class="pill">3–12 players</span><span class="pill">Phones = controllers</span></div>
   <div class="label">${name} · end card</div></div>`;
}

// scene 4: feature graphic 1024x500 at 0.5
for(const [v,name] of V.slice(1)){
  let tl='';P.forEach(p=>tl+=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800">${av(p[0],p[1],p[2],v,40)}<span>${p[3]}</span></div>`);
  html+=`<div class="frame ${v}" id="fg-${v}" style="width:512px;height:250px">
   <div style="position:absolute;left:28px;top:44px;width:250px">
     <div class="wm" style="font-size:44px">MISH ANA<span class="bang"></span></div>
     <div style="font-weight:900;font-size:21px;line-height:1.1;margin-top:10px">Everyone's innocent.<br><span style="${v==='a'?'background:var(--primary);color:#fff;padding:0 6px;border-radius:5px;box-shadow:3px 3px 0 #1A0B2E':'color:var(--accent)'}">Someone's lying.</span></div>
     <div style="font-weight:700;font-size:12px;color:var(--text2);margin-top:10px">Party game for your TV · 3–12 players · Free</div>
   </div>
   <div class="tv" style="left:285px;top:42px;width:200px;height:122px;padding:5px;transform:rotate(2deg)"><div class="tvs"><div style="position:absolute;top:8px;width:100%;text-align:center;font-weight:900;font-size:11px;color:var(--text)">Who's not one of us?</div><div style="position:absolute;top:30px;width:100%;display:flex;justify-content:center;gap:4px;color:var(--text);transform:scale(.62);transform-origin:50% 0">${tl}</div><div style="position:absolute;left:120px;top:76px;transform:rotate(-8deg);background:var(--accent);color:var(--ink);font-weight:900;font-size:16px;padding:0 8px;border-radius:5px">OUT</div></div></div>
   <div class="phone" style="left:262px;top:118px;width:58px;height:118px;padding:3px;border-radius:14px;transform:rotate(-9deg)"><div class="scr" style="border-radius:11px"><div class="card" style="top:22px;bottom:30%;background:var(--azure);font-size:11px;border-radius:7px">PIZZA</div></div></div>
   <div class="phone mole" style="left:448px;top:128px;width:56px;height:114px;padding:3px;border-radius:14px;transform:rotate(10deg)"><div class="scr" style="border-radius:11px"><div class="card" style="top:22px;bottom:30%;background:var(--tang);font-size:11px;border-radius:7px">PASTA</div></div></div>
  </div>`;
}
document.write(html);
</script>
</body></html>
