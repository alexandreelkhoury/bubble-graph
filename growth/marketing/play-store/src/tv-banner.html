<!doctype html><html><head><meta charset="utf-8"><title>TV Banner</title>
<link rel="stylesheet" href="brand.css">
<style>
/* 1280x720 Play TV banner (design-v3 D3) = the in-app launcher banner (assets/brand/banner-{en,ar}.svg, generated by
   gen_brand.py, the same art as tv-app res/drawable{,-ar}/banner.xml) drawn at 4x: palette B stage, bubble without
   a tile, wordmark beside it. ?lang=en|fr|ar (FR uses the Latin banner: the name is the same). */
.stage { width: 1280px; height: 720px; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; }
</style></head><body>
<div class="stage grain"><img id="b" alt="Mish Ana!"></div>
<script>
const lang = new URLSearchParams(location.search).get("lang") || "en";
document.getElementById("b").src = lang === "ar" ? "brand/banner-ar.svg" : "brand/banner-en.svg";
</script></body></html>
